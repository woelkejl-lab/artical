<!DOCTYPE html>
<html>
	<head>
<title>Imitation Assignment</title>
<style>
.butterfly{
  -webkit-filter: invert(100%);
  filter: invert(100%);
	height:225px;
	width:325px;
	border-radius: 35% 0% 35% 0%;
}
.dinosaur{
	 -webkit-filter: hue-rotate(90deg);
  filter: hue-rotate(90deg) drop-shadow(5px 0px 0px #000000)
}
.football{
	border-image-source: url(images/tic-tac-toe[1].png);
	  -webkit-filter: grayscale(100%);
  filter: grayscale(100%);
 border: 37px solid #000;
border-image: url(images/tic-tac-toe[1].png) 37 round;
	height:275px;
	width:450px;
}
.penguins{
 -webkit-filter: sepia(75%);
  filter: sepia(75%);
	border: 1px solid #000000;
border-radius: 100%;
	height:225px;
	width:325px;
}
.seagull{
  background-image: linear-gradient(115deg, cornflowerblue, white);
	 background-color: blue;
	height:225px;
    width:325px;
}
.stage{
   -webkit-filter: blur(3px);
  filter: blur(3px);
}
.word{
	color:white;
}
		</style>
	</head>
	<body>
		<h1>Imitation Assignment</h1>
		<div class="butterfly">
	<p> <img src="images/butterfly[1].jpg
" alt=" height="225px"  width="325px">
  </p>
		</div>
			
		<div  class="dinosaur">
    <p> <img src="images/dinosaur[1].png
" alt="" height="225px">
    </p>
		</div>
			
		<div  class="football">
      <p> <img src="images/football_field[1].jpg
"  alt="" height="225px" width="425px">
</p>
		</div>

		<div  class="penguins">
        <p> <img src="images/penguins[1].jpg
" alt="" height="225px" width="325px">
        </p>
		</div>

		<div  class="seagull">
          <p> <img src="images/seagull[1].png
" alt="football player holding ball" height="225px" width="325px">
          </p>
		</div>

		<div  class="stage">
            <p> <img src="images/theater_stage[1].jpg
" alt="" height="225px" width="225px">
            </p>
	</div>
		<div class="word" style="position:absolute; bottom:20px; left:5%;">
				<p>Presenting</p>
			</div>
	</body>
</html>
